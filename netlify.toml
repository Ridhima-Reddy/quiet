# Netlify hosting for the phone/web app (dist/web). Works for manual deploys (`npm run deploy`)
# and for a Netlify site linked to this repo (it picks these settings up automatically).
[build]
  command = "node build.mjs"
  publish = "dist/web"

[build.environment]
  NODE_VERSION = "22"

# The service worker and app shell must never be cached stale, or phones keep an old version.
[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache"
[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "no-cache"
[[headers]]
  for = "/manifest.webmanifest"
  [headers.values]
    Content-Type = "application/manifest+json"
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
