# Hosts the phone/web app on GitHub Pages (HTTPS). Run it from the Actions tab.
# Pages on a PRIVATE repo needs GitHub Pro (free for students via the GitHub Student Developer Pack).
# Once Pages is available: Settings → Pages → Source: "GitHub Actions", then add
#   push: { branches: [main] }
# under `on:` to redeploy on every push. The app will be at https://<user>.github.io/<repo>/
name: Deploy phone app
on:
  workflow_dispatch:
permissions: { contents: read, pages: write, id-token: write }
concurrency: { group: pages, cancel-in-progress: true }
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: { name: github-pages, url: '${{ steps.d.outputs.page_url }}' }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: node build.mjs
      - run: node --test "tests/unit/*.test.mjs"
      - uses: actions/upload-pages-artifact@v3
        with: { path: dist/web }
      - id: d
        uses: actions/deploy-pages@v4
